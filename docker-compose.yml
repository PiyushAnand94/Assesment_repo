services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_bookings}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    command: -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-hotel_bookings} -user=${POSTGRES_USER:-hotel_app} -password=${POSTGRES_PASSWORD:-local_dev_password} migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro

volumes:
  postgres_data:
